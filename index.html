<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الواعر</title>
    <link rel="stylesheet" href="style.css">
    <!-- Lottie Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
    </style>
</head>
<body>
    <!-- Hero Section مع الشخصية المتحركة -->
    <header class="hero">
        <div class="container">
            <div class="content">
                <h1>مرحبا! أنا <span class="highlight">ريدة</span></h1>
                <p>صانع مواقع ويب + مصمم + عشاق الأنيميشن 🚀</p>
                <button onclick="alert('شكراً لزيارتك! 😊')">تواصل معي</button>
            </div>
            
            <!-- الشخصية المتحركة -->
            <div class="character">
                <lottie-player 
                    src="https://assets4.lottiefiles.com/packages/lf20_2v5z2z2z.json" 
                    background="transparent" 
                    speed="1" 
                    style="width: 320px; height: 320px;" 
                    loop 
                    autoplay>
                </lottie-player>
            </div>
        </div>
    </header>

    <section class="about">
        <div class="container">
            <h2>عني</h2>
            <p>هاد الموقع صاوبته بـ HTML/CSS/JS فقط + Lottie للشخصية المتحركة. كلشي مجاني وينشر على GitHub Pages.</p>
        </div>
    </section>

    <footer>
        <p>© 2026 موقعي الشخصي - صاوب بـ ❤️ و GitHub</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
