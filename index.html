<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Market - سوق حسابات فري فاير</title>
    <style>
        :root {
            --primary: #ff6b00;
            --secondary: #1a1a2e;
            --accent: #00d4ff;
            --success: #00ff88;
            --danger: #ff4757;
            --bg: #0f0f1a;
            --card-bg: #16213e;
            --text: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* الهيدر */
        header {
            background: linear-gradient(135deg, var(--secondary), #16213e);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        .logo span {
            color: var(--accent);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
            align-items: center;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
            transition: 0.3s;
            font-weight: 500;
        }

        nav a:hover {
            background: var(--primary);
            color: white;
        }

        .dev-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .dev-btn:hover {
            background: #ff6b81;
        }

        /* الحاويات */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            display: none;
        }

        .active-view {
            display: block;
        }

        /* الصفحة الرئيسية */
        .hero {
            text-align: center;
            padding: 60px 20px;
            background: linear-gradient(135deg, rgba(255,107,0,0.2), rgba(0,212,255,0.2));
            border-radius: 20px;
            margin: 20px;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 30px;
        }

        .role-buttons {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .btn {
            padding: 18px 40px;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-seller {
            background: linear-gradient(135deg, var(--primary), #ff8c00);
            color: white;
        }

        .btn-buyer {
            background: linear-gradient(135deg, var(--accent), #0099cc);
            color: white;
        }

        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        /* النماذج */
        .form-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 600px;
            margin: 0 auto;
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--accent);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #2a2a4a;
            border-radius: 10px;
            background: #0f0f1a;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(255,107,0,0.3);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--success);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #00cc6a;
            transform: scale(1.02);
        }

        /* عرض الحسابات */
        .accounts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .account-card {
            background: var(--card-bg);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
            border: 2px solid transparent;
        }

        .account-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 10px 40px rgba(255,107,0,0.2);
        }

        .account-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #2a2a4a, #1a1a2e);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .account-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .account-image .placeholder {
            font-size: 4rem;
            color: #444;
        }

        .account-info {
            padding: 20px;
        }

        .account-title {
            font-size: 1.3rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .account-detail {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 0.95rem;
        }

        .account-detail i {
            color: var(--accent);
        }

        .account-price {
            font-size: 1.5rem;
            color: var(--success);
            font-weight: bold;
            margin: 15px 0;
        }

        .chat-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .chat-btn:hover {
            background: #00b8e6;
        }

        /* نافذة الشات */
        .chat-modal {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 380px;
            height: 500px;
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            z-index: 1000;
            border: 2px solid var(--primary);
        }

        .chat-header {
            background: linear-gradient(135deg, var(--primary), #ff8c00);
            color: white;
            padding: 15px 20px;
            border-radius: 15px 15px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h3 {
            font-size: 1.1rem;
        }

        .close-chat {
            cursor: pointer;
            font-size: 1.5rem;
            background: none;
            border: none;
            color: white;
        }

        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #0f0f1a;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 18px;
            border-radius: 15px;
            max-width: 80%;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .msg-received {
            background: #2a2a4a;
            align-self: flex-start;
            border-bottom-right-radius: 2px;
        }

        .msg-sent {
            background: var(--accent);
            color: #000;
            align-self: flex-end;
            margin-right: auto;
            border-bottom-left-radius: 2px;
        }

        .chat-input {
            padding: 15px;
            border-top: 2px solid #2a2a4a;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #2a2a4a;
            border-radius: 10px;
            background: #0f0f1a;
            color: white;
            font-size: 1rem;
        }

        .chat-input input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .chat-input button {
            padding: 12px 25px;
            background: var(--success);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .chat-input button:hover {
            background: #00cc6a;
        }

        /* نافذة المطور */
        .dev-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            z-index: 2000;
            display: none;
            max-width: 500px;
            width: 90%;
            border: 3px solid var(--danger);
        }

        .dev-modal h2 {
            color: var(--danger);
            text-align: center;
            margin-bottom: 20px;
        }

        .dev-modal input {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--danger);
            border-radius: 10px;
            background: #0f0f1a;
            color: white;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .dev-modal input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(255,71,87,0.5);
        }

        .dev-modal .btn-submit {
            background: var(--danger);
            color: white;
        }

        .dev-modal .btn-submit:hover {
            background: #ff6b81;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1500;
            display: none;
        }

        /* البحث */
        .search-box {
            max-width: 500px;
            margin: 0 auto 30px;
            display: block;
        }

        .search-box input {
            width: 100%;
            padding: 15px 25px;
            border: 2px solid var(--primary);
            border-radius: 30px;
            background: var(--card-bg);
            color: white;
            font-size: 1rem;
        }

        .search-box input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(255,107,0,0.3);
        }

        /* التذييل */
        footer {
            background: var(--secondary);
            text-align: center;
            padding: 20px;
            margin-top: 50px;
            color: #666;
        }

        /* إشعار */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            background: var(--success);
            color: #000;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 3000;
            display: none;
            animation: slideIn 0.3s ease;
        }
